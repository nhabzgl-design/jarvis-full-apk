name: Build T.A.L.A. Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Apply safe T.A.L.A. source fixes
        run: python3 apply_tala_fixes.py

      - name: Install JavaScript dependencies
        run: npm install

      - name: Ensure web entry point exists
        run: |
          if [ ! -f www/index.html ]; then
            echo "::error::www/index.html is missing; the actual app UI is required."
            exit 1
          fi

      - name: Add Android platform if needed
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Copy native Java files
        run: |
          D=android/app/src/main/java/com/jarvis/ai
          mkdir -p "$D"
          for f in JarvisListenService.java JarvisNotifService.java JarvisTools.java JarvisNativePlugin.java; do
            if [ -f "$f" ]; then cp "$f" "$D/$f"; fi
          done
          test -f "$D/JarvisNativePlugin.java" || {
            echo "::error::JarvisNativePlugin.java was not generated or supplied."
            exit 1
          }

      - name: Configure manifest permissions and services
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          nl = chr(10)
          permissions = [
              "RECORD_AUDIO", "MODIFY_AUDIO_SETTINGS", "FOREGROUND_SERVICE",
              "FOREGROUND_SERVICE_MICROPHONE", "POST_NOTIFICATIONS", "VIBRATE",
              "WAKE_LOCK", "CAMERA", "SET_ALARM",
          ]
          prefix = ""
          for perm in permissions:
              name = ("android.permission." + perm if perm != "SET_ALARM"
                      else "com.android.alarm.permission.SET_ALARM")
              if f'android:name="{name}"' not in s:
                  prefix += f'    <uses-permission android:name="{name}"/>{nl}'
          if prefix:
              if "<application" not in s:
                  raise SystemExit("AndroidManifest.xml has no <application> tag")
              s = s.replace("<application", prefix + "    <application", 1)
          if "JarvisNotifService" not in s:
              service = (
                  '    <service android:name="com.jarvis.ai.JarvisNotifService" '
                  'android:label="T.A.L.A." android:exported="true" '
                  'android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">'
                  '<intent-filter><action android:name="android.service.notification.NotificationListenerService"/>'
                  '</intent-filter></service>' + nl
              )
              s = s.replace("</application>", service + "</application>", 1)
          if "JarvisListenService" not in s:
              service = ('    <service android:name="com.jarvis.ai.JarvisListenService" '
                         'android:exported="false" android:foregroundServiceType="microphone"/>' + nl)
              s = s.replace("</application>", service + "</application>", 1)
          p.write_text(s)
          print("Manifest permissions and T.A.L.A. services configured.")
          PY

      - name: Configure Vosk voice engine
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/build.gradle")
          s = p.read_text()
          if "com.alphacephei:vosk-android" not in s:
              m = re.search(r"(?m)^dependencies\s*\{", s)
              if not m:
                  raise SystemExit("Cannot find dependencies block in android/app/build.gradle")
              pos = m.end()
              s = s[:pos] + '\n    implementation "com.alphacephei:vosk-android:0.3.47"\n    implementation "net.java.dev.jna:jna:5.13.0@aar"' + s[pos:]
          if "abiFilters" not in s:
              m = re.search(r"(?m)^\s*defaultConfig\s*\{", s)
              if not m:
                  raise SystemExit("Cannot find defaultConfig block in android/app/build.gradle")
              pos = m.end()
              s = s[:pos] + "\n        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }" + s[pos:]
          p.write_text(s)
          print("Vosk/JNA dependencies and ABI filters configured.")
          PY

      - name: Download English offline voice model
        run: |
          A=android/app/src/main/assets
          mkdir -p "$A"
          curl -fL --retry 3 -o /tmp/model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q /tmp/model.zip -d /tmp/vosk-model
          rm -rf "$A/model-en"
          mv /tmp/vosk-model/vosk-model-small-en-us-0.15 "$A/model-en"

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TALA-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
