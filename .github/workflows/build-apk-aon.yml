          public class JarvisListenService extends Service implements TextToSpeech.OnInitListener {

              static final String ACTION_STOP = "com.jarvis.ai.STOP";
              static final String CHANNEL = "jarvis_listen";
              static final int NOTIF_ID = 77;
              static volatile boolean running = false;

              private static final Pattern TL = Pattern.compile(
                  "\\b(ang|ng|mga|po|opo|ako|ikaw|hindi|naman|sa|ko|mo|natin|salamat|boss|gusto|kasi|pero|yung|ano|oo|sige|ayos|tapos|na|ba|lang|nga|kita|tayo|bukas|mamaya|ngayon|wala|meron|kayo|siya|namin|nyo|niyo)\\b",
                  Pattern.CASE_INSENSITIVE);

              private volatile boolean stopFlag = false;
              private Thread worker;
              private PowerManager.WakeLock wakeLock;
              private TextToSpeech tts;
              private volatile boolean ttsReady = false;
              private volatile CountDownLatch speakLatch;
              private Model model;
              private Recognizer rec;

              private SharedPreferences prefs() {
                  return getSharedPreferences("jarvis", 0);
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }

              @Override
              public void onCreate() {
                  super.onCreate();
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel ch = new NotificationChannel(CHANNEL, "Jarvis listening", NotificationManager.IMPORTANCE_LOW);
                      NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                      if (nm != null) nm.createNotificationChannel(ch);
                  }
                  tts = new TextToSpeech(getApplicationContext(), this);
              }

              @Override
              public void onInit(int status) {
                  if (status != TextToSpeech.SUCCESS) return;
                  try {
                      tts.setAudioAttributes(new AudioAttributes.Builder()
                          .setUsage(AudioAttributes.USAGE_ASSISTANT)
                          .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH).build());
                  } catch (Exception ignored) { }
                  tts.setOnUtteranceProgressListener(new UtteranceProgressListener() {
                      @Override public void onStart(String id) { }
                      @Override public void onDone(String id) { CountDownLatch l = speakLatch; if (l != null) l.countDown(); }
                      @Override public void onError(String id) { CountDownLatch l = speakLatch; if (l != null) l.countDown(); }
                  });
                  ttsReady = true;
              }

              private Notification buildNotification(String text) {
                  Intent open = getPackageManager().getLaunchIntentForPackage(getPackageName());
                  if (open == null) open = new Intent();
                  PendingIntent openPi = PendingIntent.getActivity(this, 0, open, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                  Intent stop = new Intent(this, JarvisListenService.class);
                  stop.setAction(ACTION_STOP);
                  PendingIntent stopPi = PendingIntent.getService(this, 1, stop, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                  Notification.Builder b;
                  if (Build.VERSION.SDK_INT >= 26) b = new Notification.Builder(this, CHANNEL);
                  else b = new Notification.Builder(this);
                  b.setContentTitle("J.A.R.V.I.S.");
                  b.setContentText(text);
                  b.setSmallIcon(android.R.drawable.ic_btn_speak_now);
                  b.setOngoing(true);
                  b.setContentIntent(openPi);
                  b.addAction(android.R.drawable.ic_menu_close_clear_cancel, "I-OFF", stopPi);
                  return b.build();
              }

              private void setStatus(String text) {
                  try {
                      NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                      if (nm != null) nm.notify(NOTIF_ID, buildNotification(text));
                  } catch (Exception ignored) { }
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent != null && ACTION_STOP.equals(intent.getAction())) {
                      prefs().edit().putBoolean("aon", false).apply();
                      stopWorker();
                      stopForeground(true);
                      stopSelf();
                      return START_NOT_STICKY;
                  }
                  Notification n = buildNotification("Jarvis nakikinig. Sabihin: Jarvis");
                  try {
                      if (Build.VERSION.SDK_INT >= 29) startForeground(NOTIF_ID, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE);
                      else startForeground(NOTIF_ID, n);
                  } catch (Exception e) {
                      stopSelf();
                      return START_NOT_STICKY;
                  }
                  prefs().edit().putBoolean("aon", true).apply();
                  if (!running) {
                      running = true;
                      stopFlag = false;
                      try {
                          PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                          wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "jarvis:listen");
                          wakeLock.acquire();
                      } catch (Exception ignored) { }
                      worker = new Thread(new Runnable() {
                          @Override public void run() { runLoop(); }
                      }, "jarvis-listen");
                      worker.start();
                  }
                  return START_STICKY;
              }

              private void stopWorker() {
                  stopFlag = true;
                  try { if (worker != null) worker.join(1500); } catch (Exception ignored) { }
              }

              @Override
              public void onDestroy() {
                  stopWorker();
                  running = false;
                  try { if (wakeLock != null && wakeLock.isHeld()) wakeLock.release(); } catch (Exception ignored) { }
                  try { if (tts != null) { tts.stop(); tts.shutdown(); } } catch (Exception ignored) { }
                  super.onDestroy();
              }

              // ---------------------------------------------------------------- model

              private void copyAssets(String path, File dest) throws Exception {
                  String[] list = getAssets().list(path);
                  if (list == null || list.length == 0) {
                      try {
                          InputStream in = getAssets().open(path);
                          dest.getParentFile().mkdirs();
                          OutputStream out = new FileOutputStream(dest);
                          byte[] buf = new byte[65536];
                          int r;
                          while ((r = in.read(buf)) > 0) out.write(buf, 0, r);
                          out.close();
                          in.close();
                      } catch (java.io.IOException e) {
                          dest.mkdirs();
                      }
                      return;
                  }
                  dest.mkdirs();
                  for (String name : list) copyAssets(path + "/" + name, new File(dest, name));
              }

              private void deleteRec(File f) {
                  if (f.isDirectory()) {
                      File[] kids = f.listFiles();
                      if (kids != null) for (File k : kids) deleteRec(k);
                  }
                  f.delete();
              }

              private boolean prepareModel() {
                  try {
                      File dir = new File(getFilesDir(), "model-en");
                      File ok = new File(dir, ".ok");
                      if (!ok.exists()) {
                          setStatus("Inihahanda ang voice model (isang beses lang)...");
                          deleteRec(dir);
                          copyAssets("model-en", dir);
                          new FileOutputStream(ok).close();
                      }
                      model = new Model(dir.getAbsolutePath());
                      rec = new Recognizer(model, 16000.0f, "[\"jarvis\", \"[unk]\"]");
                      return true;
                  } catch (Throwable t) {
                      setStatus("Walang voice model: " + t.getMessage());
                      return false;
                  }
              }

              // ---------------------------------------------------------------- main loop

              private void runLoop() {
                  AudioRecord ar = null;
                  try {
                      if (!prepareModel()) return;
                      int minBuf = AudioRecord.getMinBufferSize(16000, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT);
                      int bufSize = Math.max(minBuf, 32000);
                      ar = new AudioRecord(MediaRecorder.AudioSource.VOICE_RECOGNITION, 16000,
                          AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT, bufSize);
                      if (ar.getState() != AudioRecord.STATE_INITIALIZED) {
                          setStatus("Hindi mabuksan ang mic");
                          return;
                      }
                      ar.startRecording();
                      for (int w = 0; w < 30 && !ttsReady; w++) SystemClock.sleep(100);
                      speak("Online na ako, boss. Sabihin mo lang ang Jarvis.");
                      flush(ar);
                      setStatus("Nakikinig... sabihin: Jarvis");

                      short[] chunk = new short[1600];
                      ArrayDeque<short[]> ring = new ArrayDeque<short[]>();
                      while (!stopFlag) {
                          int n = ar.read(chunk, 0, chunk.length);
                          if (n <= 0) { SystemClock.sleep(20); continue; }
                          short[] copy = Arrays.copyOf(chunk, n);
                          ring.addLast(copy);
                          while (ring.size() > 16) ring.removeFirst();
                          boolean end = rec.acceptWaveForm(copy, n);
                          String txt = end ? rec.getResult() : rec.getPartialResult();
                          if (txt != null && txt.contains("jarvis")) {
                              rec.reset();
                              handleCommand(ar, ring);
                              rec.reset();
                              ring.clear();
                              flush(ar);
                              setStatus("Nakikinig... sabihin: Jarvis");
                          }
                      }
                  } catch (Throwable t) {
                      setStatus("Error: " + t.getMessage());
                  } finally {
                      try { if (ar != null) { ar.stop(); ar.release(); } } catch (Exception ignored) { }
                      try { if (rec != null) rec.close(); } catch (Exception ignored) { }
                      try { if (model != null) model.close(); } catch (Exception ignored) { }
                      running = false;
                      try { if (wakeLock != null && wakeLock.isHeld()) wakeLock.release(); } catch (Exception ignored) { }
                  }
              }

              private void flush(AudioRecord ar) {
                  try { ar.stop(); ar.startRecording(); } catch (Exception ignored) { }
              }

              private static void writeShorts(ByteArrayOutputStream o, short[] c, int n) {
                  for (int i = 0; i < n; i++) {
                      o.write(c[i] & 0xff);
                      o.write((c[i] >> 8) & 0xff);
                  }
              }

              private static double rms(short[] c, int n) {
                  double sum = 0;
                  for (int i = 0; i < n; i++) sum += (double) c[i] * c[i];
                  return Math.sqrt(sum / Math.max(1, n));
              }

              private void vibrate(long ms) {
                  try {
                      Vibrator v = (Vibrator) getSystemService(Context.VIBRATOR_SERVICE);
                      if (v == null) return;
                      if (Build.VERSION.SDK_INT >= 26) v.vibrate(VibrationEffect.createOneShot(ms, VibrationEffect.DEFAULT_AMPLITUDE));
                      else v.vibrate(ms);
                  } catch (Exception ignored) { }
              }

              private void handleCommand(AudioRecord ar, ArrayDeque<short[]> ring) {
                  vibrate(70);
                  setStatus("Nakikinig sa utos mo...");
                  ByteArrayOutputStream pcm = new ByteArrayOutputStream();
                  for (short[] c : ring) writeShorts(pcm, c, c.length);

                  short[] chunk = new short[1600];
                  long start = SystemClock.uptimeMillis();
                  boolean spoke = false;
                  int quiet = 0;
                  int loudRun = 0;
                  double floor = 1e9;
                  while (!stopFlag) {
                      int n = ar.read(chunk, 0, chunk.length);
                      if (n <= 0) { SystemClock.sleep(20); continue; }
                      writeShorts(pcm, chunk, n);
                      double r = rms(chunk, n);
                      if (r < floor) floor = r;
                      long el = SystemClock.uptimeMillis() - start;
                      double thr = Math.max(700.0, floor * 3.0);
                      if (el >= 400) {
                          if (r > thr) {
                              loudRun++;
                              quiet = 0;
                              if (loudRun >= 2) spoke = true;
                          } else {
                              loudRun = 0;
                              if (spoke) quiet++;
                          }
                      }
                      if (spoke && quiet >= 10) break;
                      if (!spoke && el > 4500) break;
                      if (el > 10000) break;
                  }
                  if (!spoke || stopFlag) return;

                  setStatus("Iniisip...");
                  try {
                      byte[] wav = wav(pcm.toByteArray());
                      String b64 = Base64.encodeToString(wav, Base64.NO_WRAP);
                      String reply = askServer(b64);
                      if (reply != null && reply.trim().length() > 0 && !reply.contains("[NOSPEECH]")) {
                          setStatus("Sumasagot...");
                          speak(reply);
                      }
                  } catch (Exception e) {
                      speak("Boss, may problema sa koneksyon. Subukan mo ulit.");
                  }
              }

              // ---------------------------------------------------------------- audio + server

              private static void le32(ByteArrayOutputStream o, int v) {
                  o.write(v & 0xff);
                  o.write((v >> 8) & 0xff);
                  o.write((v >> 16) & 0xff);
                  o.write((v >> 24) & 0xff);
              }

              private static void le16(ByteArrayOutputStream o, int v) {
                  o.write(v & 0xff);
                  o.write((v >> 8) & 0xff);
              }

              private static void str(ByteArrayOutputStream o, String s) {
                  byte[] b = s.getBytes();
                  o.write(b, 0, b.length);
              }

              private byte[] wav(byte[] pcm) {
                  ByteArrayOutputStream o = new ByteArrayOutputStream();
                  str(o, "RIFF");
                  le32(o, 36 + pcm.length);
                  str(o, "WAVE");
                  str(o, "fmt ");
                  le32(o, 16);
                  le16(o, 1);
                  le16(o, 1);
                  le32(o, 16000);
                  le32(o, 32000);
                  le16(o, 2);
                  le16(o, 16);
                  str(o, "data");
                  le32(o, pcm.length);
                  o.write(pcm, 0, pcm.length);
                  return o.toByteArray();
              }

              private String readAll(InputStream is) throws Exception {
                  if (is == null) return "";
                  ByteArrayOutputStream o = new ByteArrayOutputStream();
                  byte[] buf = new byte[8192];
                  int r;
                  while ((r = is.read(buf)) > 0) o.write(buf, 0, r);
                  return new String(o.toByteArray(), "UTF-8");
              }

              private JSONObject postChat(JSONObject payload) throws Exception {
                  URL u = new URL(prefs().getString("base", "") + "/chat");
                  HttpURLConnection c = (HttpURLConnection) u.openConnection();
                  c.setRequestMethod("POST");
                  c.setConnectTimeout(20000);
                  c.setReadTimeout(80000);
                  c.setRequestProperty("content-type", "application/json");
                  c.setRequestProperty("x-pass", prefs().getString("pass", "1234"));
                  c.setDoOutput(true);
                  byte[] body = payload.toString().getBytes("UTF-8");
                  c.setFixedLengthStreamingMode(body.length);
                  OutputStream os = c.getOutputStream();
                  os.write(body);
                  os.close();
                  int code = c.getResponseCode();
                  String s = readAll(code >= 400 ? c.getErrorStream() : c.getInputStream());
                  if (code >= 400) throw new Exception("HTTP " + code + " " + s);
                  return new JSONObject(s);
              }

              private String askServer(String b64) throws Exception {
                  JSONArray messages = new JSONArray();
                  JSONObject um = new JSONObject();
                  um.put("role", "user");
                  JSONArray content = new JSONArray();
                  JSONObject audio = new JSONObject();
                  audio.put("type", "audio");
                  audio.put("mime", "audio/wav");
                  audio.put("data", b64);
                  content.put(audio);
                  JSONObject txt = new JSONObject();
                  txt.put("type", "text");
                  txt.put("text", "(Voice command recorded right after the wake word. Understand it and act.)");
                  content.put(txt);
                  um.put("content", content);
                  messages.put(um);

                  JSONArray tools = new JSONArray(prefs().getString("tools", "[]"));
                  String system = prefs().getString("system", "");
                  String finalText = "";
                  for (int round = 0; round < 4; round++) {
                      JSONObject payload = new JSONObject();
                      payload.put("system", system);
                      payload.put("tools", tools);
                      payload.put("messages", messages);
                      JSONObject resp = postChat(payload);
                      JSONArray rc = resp.getJSONArray("content");
                      JSONObject am = new JSONObject();
                      am.put("role", "assistant");
                      am.put("content", rc);
                      messages.put(am);

                      JSONArray results = new JSONArray();
                      for (int i = 0; i < rc.length(); i++) {
                          JSONObject b = rc.getJSONObject(i);
                          String type = b.optString("type", "");
                          if ("text".equals(type)) {
                              finalText = b.optString("text", finalText);
                          } else if ("tool_use".equals(type)) {
                              JSONObject in = b.optJSONObject("input");
                              if (in == null) in = new JSONObject();
                              String res = runTool(b.optString("name", ""), in);
                              JSONObject tr = new JSONObject();
                              tr.put("type", "tool_result");
                              tr.put("tool_use_id", b.optString("id", ""));
                              tr.put("content", res);
                              results.put(tr);
                          }
                      }
                      if (results.length() == 0) break;
                      JSONObject rm = new JSONObject();
                      rm.put("role", "user");
                      rm.put("content", results);
                      messages.put(rm);
                  }
                  return finalText.replaceAll("[*#_`]", "");
              }

              // ---------------------------------------------------------------- speech

              private void speak(String text) {
                  if (!ttsReady || text == null || text.trim().length() == 0) return;
                  AudioManager am = (AudioManager) getSystemService(Context.AUDIO_SERVICE);
                  AudioFocusRequest req = null;
                  try {
                      if (Build.VERSION.SDK_INT >= 26 && am != null) {
                          req = new AudioFocusRequest.Builder(AudioManager.AUDIOFOCUS_GAIN_TRANSIENT_MAY_DUCK)
                              .setAudioAttributes(new AudioAttributes.Builder()
                                  .setUsage(AudioAttributes.USAGE_ASSISTANT)
                                  .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH).build())
                              .build();
                          am.requestAudioFocus(req);
                      }
                      boolean tl = TL.matcher(text).find();
                      int r = tts.setLanguage(tl ? new Locale("fil", "PH") : Locale.US);
                      if (r == TextToSpeech.LANG_MISSING_DATA || r == TextToSpeech.LANG_NOT_SUPPORTED) tts.setLanguage(Locale.US);
                      tts.setPitch(0.9f);
                      speakLatch = new CountDownLatch(1);
                      tts.speak(text, TextToSpeech.QUEUE_FLUSH, null, "aon" + SystemClock.uptimeMillis());
                      speakLatch.await(30, TimeUnit.SECONDS);
                  } catch (Exception ignored) {
                  } finally {
                      try { if (req != null && am != null) am.abandonAudioFocusRequest(req); } catch (Exception ignored) { }
                  }
              }

              // ---------------------------------------------------------------- tools

              private boolean startActivitySafe(Intent i) {
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  try { startActivity(i); return true; } catch (Exception e) { return false; }
              }

              private boolean startUrl(String url) {
                  if (url == null || url.length() == 0) return false;
                  return startActivitySafe(new Intent(Intent.ACTION_VIEW, Uri.parse(url)));
              }

              private String launchByName(String q) {
                  PackageManager pm = getPackageManager();
                  Intent main = new Intent(Intent.ACTION_MAIN);
                  main.addCategory(Intent.CATEGORY_LAUNCHER);
                  ResolveInfo best = null;
                  int bestScore = 0;
                  for (ResolveInfo ri : pm.queryIntentActivities(main, 0)) {
                      String label = String.valueOf(ri.loadLabel(pm)).toLowerCase(Locale.ROOT);
                      String pkg = ri.activityInfo.packageName.toLowerCase(Locale.ROOT);
                      int score = 0;
                      if (label.equals(q) || pkg.equals(q)) score = 100;
                      else if (label.startsWith(q)) score = 80;
                      else if (label.contains(q)) score = 60;
                      else if (pkg.contains(q)) score = 40;
                      if (score > bestScore) { bestScore = score; best = ri; }
                  }
                  if (best == null) return null;
                  Intent li = pm.getLaunchIntentForPackage(best.activityInfo.packageName);
                  if (li == null) return null;
                  if (!startActivitySafe(li)) return null;
                  return String.valueOf(best.loadLabel(pm));
              }

              private boolean openMusic() {
                  try {
                      Intent i = Intent.makeMainSelectorActivity(Intent.ACTION_MAIN, Intent.CATEGORY_APP_MUSIC);
                      if (startActivitySafe(i)) return true;
                  } catch (Exception ignored) { }
                  PackageManager pm = getPackageManager();
                  Intent main = new Intent(Intent.ACTION_MAIN);
                  main.addCategory(Intent.CATEGORY_LAUNCHER);
                  for (ResolveInfo ri : pm.queryIntentActivities(main, 0)) {
                      String label = String.valueOf(ri.loadLabel(pm)).toLowerCase(Locale.ROOT);
                      if (label.contains("music") || label.contains("musik") || label.contains("player") || label.contains("mp3")) {
                          Intent li = pm.getLaunchIntentForPackage(ri.activityInfo.packageName);
                          if (li != null && startActivitySafe(li)) return true;
                      }
                  }
                  return false;
              }

              private String toolOpenApp(String app, String query) {
                  String key = app.toLowerCase(Locale.ROOT).trim();
                  if (key.contains("music") || key.contains("musika") || key.contains("musik") || key.contains("player") || key.contains("mp3") || key.contains("kanta")) {
                      return openMusic() ? "opened the phone music player" : "no music player found";
                  }
                  if (query != null && query.length() > 0) {
                      String q = Uri.encode(query);
                      if (key.contains("youtube")) {
                          if (startUrl("vnd.youtube://results?search_query=" + q) || startUrl("https://www.youtube.com/results?search_query=" + q)) return "opened youtube search: " + query;
                      } else if (key.contains("facebook")) {
                          if (startUrl("https://www.facebook.com/search/top/?q=" + q)) return "opened facebook search: " + query;
                      } else if (key.contains("google")) {
                          if (startUrl("https://www.google.com/search?q=" + q)) return "opened google search: " + query;
                      } else if (key.contains("maps")) {
                          if (startUrl("geo:0,0?q=" + q)) return "opened maps search: " + query;
                      }
                  }
                  String label = launchByName(key);
                  if (label != null) return "opened " + label;
                  return "app not found or could not be opened: " + app;
              }

              private MediaController activeController() {
                  try {
                      MediaSessionManager msm = (MediaSessionManager) getSystemService(Context.MEDIA_SESSION_SERVICE);
                      List<MediaController> cs = msm.getActiveSessions(new ComponentName(this, JarvisNotifService.class));
                      if (cs != null && !cs.isEmpty()) return cs.get(0);
                  } catch (Exception ignored) { }
                  return null;
              }

              private void keyEvent(int code) {
                  AudioManager am = (AudioManager) getSystemService(Context.AUDIO_SERVICE);
                  long t = SystemClock.uptimeMillis();
                  am.dispatchMediaKeyEvent(new KeyEvent(t, t, KeyEvent.ACTION_DOWN, code, 0));
                  am.dispatchMediaKeyEvent(new KeyEvent(t, t, KeyEvent.ACTION_UP, code, 0));
              }

              private String toolMusic(String action) {
                  String a = action.toLowerCase(Locale.ROOT).trim();
                  if ("open".equals(a)) return openMusic() ? "opened the phone music player" : "no music player found";
                  MediaController mc = activeController();
                  if ("now_playing".equals(a)) {
                      if (mc == null) return "nothing is playing, or Notification Access is off";
                      MediaMetadata md = mc.getMetadata();
                      PlaybackState ps = mc.getPlaybackState();
                      String title = md == null ? "" : String.valueOf(md.getString(MediaMetadata.METADATA_KEY_TITLE));
                      String artist = md == null ? "" : String.valueOf(md.getString(MediaMetadata.METADATA_KEY_ARTIST));
                      boolean playing = ps != null && ps.getState() == PlaybackState.STATE_PLAYING;
                      return (playing ? "playing: " : "paused: ") + title + (artist.length() > 0 && !"null".equals(artist) ? " by " + artist : "");
                  }
                  int code;
                  if ("play".equals(a)) code = KeyEvent.KEYCODE_MEDIA_PLAY;
                  else if ("pause".equals(a)) code = KeyEvent.KEYCODE_MEDIA_PAUSE;
                  else if ("toggle".equals(a)) code = KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE;
                  else if ("next".equals(a)) code = KeyEvent.KEYCODE_MEDIA_NEXT;
                  else if ("previous".equals(a)) code = KeyEvent.KEYCODE_MEDIA_PREVIOUS;
                  else if ("stop".equals(a)) code = KeyEvent.KEYCODE_MEDIA_STOP;
                  else return "unknown music action";
                  if (mc != null) {
                      MediaController.TransportControls tc = mc.getTransportControls();
                      if ("play".equals(a)) tc.play();
                      else if ("pause".equals(a)) tc.pause();
                      else if ("next".equals(a)) tc.skipToNext();
                      else if ("previous".equals(a)) tc.skipToPrevious();
                      else if ("stop".equals(a)) tc.stop();
                      else {
                          PlaybackState ps = mc.getPlaybackState();
                          if (ps != null && ps.getState() == PlaybackState.STATE_PLAYING) tc.pause(); else tc.play();
                      }
                      return "sent " + a;
                  }
                  if ("play".equals(a)) {
                      openMusic();
                      SystemClock.sleep(2500);
                  }
                  keyEvent(code);
                  return "sent " + a + " (media key)";
              }

              private String toolFlashlight(boolean on) {
                  try {
                      CameraManager cm = (CameraManager) getSystemService(Context.CAMERA_SERVICE);
                      String id = null;
                      for (String cid : cm.getCameraIdList()) {
                          CameraCharacteristics c = cm.getCameraCharacteristics(cid);
                          Boolean flash = c.get(CameraCharacteristics.FLASH_INFO_AVAILABLE);
                          Integer facing = c.get(CameraCharacteristics.LENS_FACING);
                          if (Boolean.TRUE.equals(flash) && facing != null && facing == CameraCharacteristics.LENS_FACING_BACK) { id = cid; break; }
                      }
                      if (id == null) return "no flashlight found";
                      cm.setTorchMode(id, on);
                      return "flashlight " + (on ? "ON" : "OFF");
                  } catch (Exception e) {
                      return "flashlight failed: " + e.getMessage();
                  }
              }

              private String toolPhone(JSONObject in) {
                  String kind = in.optString("kind", "").toLowerCase(Locale.ROOT);
                  String target = in.optString("target", "");
                  String body = in.optString("body", "");
                  Intent i;
                  if ("whatsapp".equals(kind)) {
                      i = new Intent(Intent.ACTION_VIEW, Uri.parse("https://wa.me/" + target.replaceAll("[^0-9]", "") + "?text=" + Uri.encode(body)));
                  } else if ("mailto".equals(kind)) {
                      i = new Intent(Intent.ACTION_SENDTO, Uri.parse("mailto:" + target));
                      i.putExtra(Intent.EXTRA_TEXT, body);
                  } else if ("sms".equals(kind)) {
                      i = new Intent(Intent.ACTION_SENDTO, Uri.parse("smsto:" + target));
                      i.putExtra("sms_body", body);
                  } else {
                      i = new Intent(Intent.ACTION_DIAL, Uri.parse("tel:" + target));
                  }
                  return startActivitySafe(i) ? "prepared " + kind + " (the user must confirm on screen)" : "failed";
              }

              private String runTool(String name, JSONObject in) {
                  try {
                      if ("open_app".equals(name)) return toolOpenApp(in.optString("app", ""), in.optString("query", ""));
                      if ("open_url".equals(name)) return startUrl(in.optString("url", "")) ? "opened" : "failed";
                      if ("phone_action".equals(name)) return toolPhone(in);
                      if ("music_player".equals(name)) return toolMusic(in.optString("action", ""));
                      if ("flashlight".equals(name)) return toolFlashlight(in.optBoolean("on", true));
                      if ("current_time".equals(name)) return new java.util.Date().toString();
                      if ("get_device_info".equals(name)) return Build.MANUFACTURER + " " + Build.MODEL + ", Android " + Build.VERSION.RELEASE;
                      if ("set_timer".equals(name)) {
                          Intent i = new Intent(AlarmClock.ACTION_SET_TIMER);
                          i.putExtra(AlarmClock.EXTRA_LENGTH, (int) in.optDouble("seconds", 60));
                          i.putExtra(AlarmClock.EXTRA_MESSAGE, in.optString("label", "Jarvis"));
                          i.putExtra(AlarmClock.EXTRA_SKIP_UI, true);
                          return startActivitySafe(i) ? "timer set" : "timer failed";
                      }
                      if ("set_alarm".equals(name)) {
                          Intent i = new Intent(AlarmClock.ACTION_SET_ALARM);
                          i.putExtra(AlarmClock.EXTRA_HOUR, (int) in.optDouble("hour", 7));
                          i.putExtra(AlarmClock.EXTRA_MINUTES, (int) in.optDouble("minute", 0));
                          i.putExtra(AlarmClock.EXTRA_MESSAGE, in.optString("label", "Jarvis"));
                          i.putExtra(AlarmClock.EXTRA_SKIP_UI, true);
                          return startActivitySafe(i) ? "alarm set" : "alarm failed";
                      }
                      if ("volume".equals(name)) {
                          AudioManager am = (AudioManager) getSystemService(Context.AUDIO_SERVICE);
                          int d = "down".equals(in.optString("dir", "up")) ? AudioManager.ADJUST_LOWER : AudioManager.ADJUST_RAISE;
                          am.adjustStreamVolume(AudioManager.STREAM_MUSIC, d, 0);
                          am.adjustStreamVolume(AudioManager.STREAM_MUSIC, d, AudioManager.FLAG_SHOW_UI);
                          return "volume " + in.optString("dir", "up");
                      }
                      if ("get_battery".equals(name)) {
                          Intent b = registerReceiver(null, new IntentFilter(Intent.ACTION_BATTERY_CHANGED));
                          if (b == null) return "battery unavailable";
                          int level = b.getIntExtra(BatteryManager.EXTRA_LEVEL, -1);
                          int scale = b.getIntExtra(BatteryManager.EXTRA_SCALE, 100);
                          int status = b.getIntExtra(BatteryManager.EXTRA_STATUS, -1);
                          boolean charging = status == BatteryManager.BATTERY_STATUS_CHARGING || status == BatteryManager.BATTERY_STATUS_FULL;
                          return "battery " + (level * 100 / Math.max(1, scale)) + "%, " + (charging ? "charging" : "not charging");
                      }
                      if ("remember".equals(name)) {
                          SharedPreferences p = prefs();
                          JSONArray arr = new JSONArray(p.getString("notes", "[]"));
                          String note = in.optString("note", "");
                          if (note.length() > 0) {
                              arr.put(note);
                              p.edit().putString("notes", arr.toString()).apply();
                              return "saved";
                          }
                          return arr.toString();
                      }
                      if ("read_notifications".equals(name)) {
                          StringBuilder sb = new StringBuilder();
                          synchronized (JarvisNotifService.recent) {
                              int n = Math.min(5, JarvisNotifService.recent.size());
                              for (int k = 0; k < n; k++) sb.append(JarvisNotifService.recent.get(k)).append("\n");
                          }
                          return sb.length() == 0 ? "no recent Messenger or Facebook notifications" : sb.toString();
                      }
                      if ("set_auto_read".equals(name)) {
                          boolean e = in.optBoolean("enabled", true);
                          prefs().edit().putBoolean("autoread", e).apply();
                          return "auto read " + (e ? "ON" : "OFF");
                      }
                      return "that tool is not available in background mode";
                  } catch (Exception e) {
                      return "error: " + e.getMessage();
                  }
              }
          }
          EOF
          cat > "$D/MainActivity.java" <<'EOF'
          package com.jarvis.ai;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(JarvisNativePlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF

      - name: Patch manifest
        run: |
          M=android/app/src/main/AndroidManifest.xml
          if ! grep -q RECORD_AUDIO "$M"; then
            sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <uses-permission android:name="com.android.alarm.permission.SET_ALARM"/>\n    <uses-permission android:name="android.permission.FLASHLIGHT"/>\n    <queries><intent><action android:name="android.speech.RecognitionService"/></intent><intent><action android:name="android.intent.action.TTS_SERVICE"/></intent><intent><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent></queries>\n    <application#' "$M"
          fi
          for P in FOREGROUND_SERVICE FOREGROUND_SERVICE_MICROPHONE POST_NOTIFICATIONS VIBRATE SYSTEM_ALERT_WINDOW WAKE_LOCK; do
            grep -q "android.permission.$P\"" "$M" || sed -i "s#<application#<uses-permission android:name=\"android.permission.$P\"/>\n    <application#" "$M"
          done
          if ! grep -q JarvisNotifService "$M"; then
            sed -i 's#</application>#<service android:name="com.jarvis.ai.JarvisNotifService" android:label="Jarvis" android:exported="true" android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"><intent-filter><action android:name="android.service.notification.NotificationListenerService"/></intent-filter></service>\n    </application>#' "$M"
          fi
          if ! grep -q JarvisListenService "$M"; then
            sed -i 's#</application>#<service android:name="com.jarvis.ai.JarvisListenService" android:exported="false" android:foregroundServiceType="microphone"/>\n    </application>#' "$M"
          fi
          cat "$M"

      - name: Patch gradle (offline voice engine)
        run: |
          G=android/app/build.gradle
          grep -q vosk-android "$G" || sed -i "0,/^dependencies {/s//dependencies {\n    implementation 'com.alphacephei:vosk-android:0.3.47'\n    implementation 'net.java.dev.jna:jna:5.13.0@aar'/" "$G"
          grep -q abiFilters "$G" || sed -i "0,/defaultConfig {/s//defaultConfig {\n        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }/" "$G"
          cat "$G"

      - name: Sync web files
        run: npx cap sync android

      - name: Add voice model
        run: |
          A=android/app/src/main/assets
          mkdir -p "$A"
          curl -fL --retry 3 -o /tmp/model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q /tmp/model.zip -d /tmp/m
          rm -rf "$A/model-en"
          mv /tmp/m/vosk-model-small-en-us-0.15 "$A/model-en"
          du -sh "$A/model-en"

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK-24-7
          path: android/app/build/outputs/apk/debug/app-debug.apk
