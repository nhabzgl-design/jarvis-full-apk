<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>JARVIS</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#020b16}
iframe{width:100%;height:100%;border:0;display:block}
#loading{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 35%,#06223a,#020b16 70%);color:#5fd8ff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:monospace;z-index:9999;transition:opacity 0.5s}
.spinner{width:40px;height:40px;border:3px solid rgba(95,216,255,0.2);border-top-color:#5fd8ff;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:15px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="loading">
<div class="spinner"></div>
<div style="letter-spacing:.3em;font-weight:700">J.A.R.V.I.S</div>
<div style="font-size:11px;margin-top:8px;opacity:0.7">Loading from Render...</div>
</div>
<iframe id="jarvis" src="https://jarvis-ai-9drf.onrender.com/?v=fullapk" allow="microphone *; camera *; geolocation *"></iframe>
<script>
const iframe=document.getElementById('jarvis');
const loading=document.getElementById('loading');
iframe.onload=()=>{setTimeout(()=>{loading.style.opacity='0';setTimeout(()=>loading.style.display='none',500)},1500)};
setTimeout(()=>{loading.style.display='none'},8000);
</script>
</body>
</html>
