<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>J.A.R.V.I.S.</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Share+Tech+Mono&display=swap">
<style>
:root{--bg:#020b16;--cy:#5fd8ff;--dim:#2a7390;--ok:#3ee59a;--am:#ffb347;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:radial-gradient(ellipse at 50% 35%,#06223a,var(--bg) 70%);color:var(--cy);font-family:"Share Tech Mono",monospace}
body{display:flex;flex-direction:column;padding:10px 14px 12px;gap:8px;max-width:640px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;font:700 20px Rajdhani,sans-serif;letter-spacing:.3em}
#st{font:500 13px Rajdhani,sans-serif;letter-spacing:.16em;padding:4px 10px;border:1px solid var(--am);color:var(--am);border-radius:99px}
#st.on{border-color:var(--ok);color:var(--ok)}
#chips{display:flex;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--dim)}
#chips span{border:1px solid #14405a;padding:4px 8px;background:rgba(95,216,255,.05)}
#chips i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--dim);margin-right:6px}
#chips i.g{background:var(--ok)}
#stage{flex:1;min-height:0;display:grid;place-items:center;position:relative}
#orb{width:min(88vw,46vh);aspect-ratio:1;max-width:100%}
#core{position:absolute;text-align:center;pointer-events:none;font:700 clamp(16px,5vw,26px) Rajdhani,sans-serif;letter-spacing:.28em;text-shadow:0 0 14px var(--cy)}
#core small{display:block;font:400 11px "Share Tech Mono",monospace;letter-spacing:.08em;color:var(--dim);margin-top:6px;max-width:30vw;margin-inline:auto;min-height:1.2em}
#log{height:24vh;overflow:auto;font-size:13px;line-height:1.5;border-top:1px solid #14405a;padding-top:8px}
#log p{margin:0 0 6px}
#log .you{color:#9fb8c4}#log .jarvis{color:var(--cy)}#log .sys{color:var(--am)}
#bar{display:flex;gap:8px}
input{flex:1;background:rgba(95,216,255,.06);border:1px solid #14405a;color:var(--cy);padding:11px;font:inherit;font-size:14px}
button{background:rgba(95,216,255,.08);color:var(--cy);border:1px solid var(--dim);padding:0 14px;font:700 14px Rajdhani,sans-serif;letter-spacing:.14em;cursor:pointer;min-height:44px}
#mic.on{background:var(--cy);color:var(--bg)}
</style>
</head>
<body>
<header><span>J.A.R.V.I.S</span><span id="st">STANDBY</span></header>
<div id="chips"><span><i id="cv"></i>Voice</span><span><i id="cc"></i>Core</span><span><i class="g"></i>Tools 5</span><span><i class="g"></i>Phone links</span></div>
<div id="stage"><canvas id="orb"></canvas><div id="core">J.A.R.V.I.S<small id="int"></small></div></div>
<div id="log"></div>
<div id="bar"><button id="lang">EN</button><input id="txt" placeholder="Type or tap mic…"><button id="send">SEND</button><button id="keys">PASS</button><button id="mic">MIC</button></div>
<script>
const $=id=>document.getElementById(id);
const K=k=>{try{return localStorage.getItem(k)||''}catch(_){return''}};
let lang='en-US',on=false,rec=null,speaking=false,busy=false,nl=false,hist=[],state='STANDBY',amp=0,t=0;
const SYS=`You are J.A.R.V.I.S., British butler on phone. Address as sir or boss. Reply Taglish natural Manila, not deep Tagalog. Avoid "batid". Use "Gets kita boss", "Sige". 2 sentences max, no markdown. Tools for actions. Full phone access via Capacitor.`;
function setSt(s){state=s;const e=$('st');e.textContent=s;e.className=s=='STANDBY'?'':'on'}
function log(k,txt){const p=document.createElement('p');p.className=k;p.textContent=(k=='you'?'> ':k=='jarvis'?'J: ':'! ')+txt;$('log').append(p);$('log').scrollTop=1e9}
function openLink(u){if(/^(tel|sms|mailto):/i.test(u)){location.href=u;return}let w=null;try{w=window.open(u,'_blank')}catch(_){}if(!w)log('sys','Tap to continue: '+u)}
const NSR=()=>window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.SpeechRecognition;
const tools=[
 {name:'open_url',description:'Open website',inputSchema:{type:'object',properties:{url:{type:'string'}},required:['url']},execute:({url})=>{openLink(url);return 'opened '+url}},
 {name:'phone_action',description:'Call SMS WhatsApp email kind tel sms whatsapp mailto',inputSchema:{type:'object',properties:{kind:{type:'string'},target:{type:'string'},body:{type:'string'}},required:['kind','target']},execute:({kind,target,body})=>{const b=encodeURIComponent(body||'');const u=kind=='whatsapp'?`https://wa.me/${target.replace(/\D/g,'')}?text=${b}`:kind=='mailto'?`mailto:${target}?body=${b}`:`${kind}:${target}${kind=='sms'&&body?'?body='+b:''}`;openLink(u);return 'prepared '+kind}},
 {name:'set_timer',description:'Set timer seconds',inputSchema:{type:'object',properties:{seconds:{type:'number'},label:{type:'string'}},required:['seconds']},execute:({seconds,label})=>{setTimeout(()=>{log('sys','Timer: '+(label||'done'))},seconds*1000);return 'timer '+seconds}},
 {name:'remember',description:'Save note',inputSchema:{type:'object',properties:{note:{type:'string'}}},required:[],execute:({note})=>{let n=[];try{n=JSON.parse(localStorage.getItem('jv')||'[]')}catch(_){}if(note){n.push(note);localStorage.setItem('jv',JSON.stringify(n));return 'saved'}return JSON.stringify(n)}},
 {name:'current_time',description:'Current time',inputSchema:{type:'object',properties:{},required:[]},execute:()=>new Date().toString()}
];
async function llm(m){
  // Use your Render server which already has GEMINI_API_KEY!
  const r=await fetch('https://jarvis-ai-9drf.onrender.com/chat',{method:'POST',headers:{'content-type':'application/json','x-pass':K('pw')||'1234'},body:JSON.stringify({system:SYS,tools:tools.map(({name,description,inputSchema})=>({name,description,input_schema:inputSchema})),messages:m})});
  if(!r.ok)throw new Error(r.status);
  return r.json()
}
async function ask(q){if(busy)return;busy=true;log('you',q);setSt('THINKING');hist.push({role:'user',content:q});hist=hist.slice(-6);try{const mm=hist.slice();let out='';for(let i=0;i<4;i++){const d=await llm(mm);mm.push({role:'assistant',content:d.content});const tu=d.content.filter(b=>b.type=='tool_use');out=d.content.filter(b=>b.type=='text').map(b=>b.text).join(' ')||out;if(!tu.length)break;const rs=[];for(const u of tu){let res;try{res=String(await tools.find(z=>z.name==u.name).execute(u.input))}catch(e){res='error'}rs.push({type:'tool_result',tool_use_id:u.id,content:res})}mm.push({role:'user',content:rs})}log('jarvis',out||'Very good sir');const ut=new SpeechSynthesisUtterance((out||'Very good sir').replace(/[*#_`]/g,''));ut.lang=/[^\x00-\x7F]/.test(out)?'fil-PH':'en-GB';speechSynthesis.speak(ut);}catch(e){log('sys','Error: '+e.message)}busy=false;setSt(on?'LISTENING':'STANDBY')}
function listen(){if(!(on&&rec&&!speaking&&!busy))return;try{rec.start();setSt('LISTENING')}catch(_){}}
function initRec(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){log('sys','No voice, type below');return false}rec=new SR();rec.lang=lang;rec.interimResults=true;rec.onresult=e=>{let f='',i='';for(const r of e.results)r.isFinal?f+=r[0].transcript:i+=r[0].transcript;$('int').textContent=(i||f).slice(-40);if(f.trim()){$('int').textContent='';ask(f.trim())}};rec.onerror=e=>{if(/not-allowed/.test(e.error)){on=false;$('mic').classList.remove('on');setSt('STANDBY');log('sys','Mic blocked')}};rec.onend=()=>listen();return true}
$('mic').onclick=async()=>{if(on){on=false;$('mic').classList.remove('on');try{rec&&rec.abort()}catch(_){}try{NSR()&&NSR().stop()}catch(_){}setSt('STANDBY');return}if(NSR()){try{const p=await NSR().requestPermissions();if(p.speechRecognition!=='granted'){log('sys','Mic denied');return}}catch(_){}}else if(!rec&&!initRec())return;on=true;$('mic').classList.add('on');if(!hist.length){log('jarvis','Good day sir. Jarvis online.');}else listen()};
$('lang').onclick=function(){lang=lang=='en-US'?'fil-PH':'en-US';this.textContent=lang=='en-US'?'EN':'TL';if(rec){rec.lang=lang;try{rec.abort()}catch(_){}}};
$('txt').onkeydown=e=>{if(e.key=='Enter'&&e.target.value.trim()){const q=e.target.value.trim();e.target.value='';ask(q)}};
$('send').onclick=()=>{const q=$('txt').value.trim();if(q){$('txt').value='';ask(q)}};
$('keys').onclick=()=>{const p=prompt('Passcode (1234)',K('pw'));if(p!==null)localStorage.setItem('pw',p.trim())};
$('cv').className=(NSR()||window.SpeechRecognition||window.webkitSpeechRecognition)?'g':'';
$('cc').className='g';
const cv=$('orb'),x=cv.getContext('2d'),D=Math.min(devicePixelRatio||1,2),calm=matchMedia('(prefers-reduced-motion: reduce)').matches;let S=300;
function rs(){S=cv.clientWidth;cv.width=cv.height=S*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',rs);rs();
function arcs(r,n,gap,w,off,col){x.strokeStyle=col;x.lineWidth=w;const seg=6.283/n;for(let i=0;i<n;i++){x.beginPath();x.arc(S/2,S/2,r,off+i*seg,off+(i+1)*seg-gap);x.stroke()}}
function draw(){if(!calm)t+=.012;const th=state=='THINKING',col=th?'255,179,71':'95,216,255';const target=state=='SPEAKING'?.5+Math.random()*.5:state=='LISTENING'?.25+.15*Math.sin(t*6):th?.5:.1;amp+=(target-amp)*.15;x.clearRect(0,0,S,S);const c=S/2,R=S*.47;const g=x.createRadialGradient(c,c,R*.2,c,c,R);g.addColorStop(0,`rgba(${col},${.10+amp*.2})`);g.addColorStop(1,`rgba(${col},0)`);x.fillStyle=g;x.beginPath();x.arc(c,c,R,0,7);x.fill();arcs(R,5,.5,3,t*(th?3:.8),`rgba(${col},.9)`);arcs(R*.88,24,.12,2,-t*1.2,`rgba(${col},.55)`);arcs(R*.74,3,.9,4,t*1.9,`rgba(${col},.8)`);x.strokeStyle=`rgba(${col},.35)`;x.lineWidth=1;for(const k of[.62,.5]){x.beginPath();x.arc(c,c,R*k,0,7);x.stroke()}for(let i=0;i<60;i++){const a=i/60*6.283+t*.3,l=i%5?4:9;x.beginPath();x.moveTo(c+Math.cos(a)*R*1.0,c+Math.sin(a)*R*1.0);x.lineTo(c+Math.cos(a)*(R*1.0-l),c+Math.sin(a)*(R*1.0-l));x.stroke()}x.strokeStyle=`rgba(${col},.9)`;x.lineWidth=2;x.beginPath();for(let i=-20;i<=20;i++){const px=c+i*R*.016,py=c+R*.2+Math.sin(i*.7+t*8)*amp*R*.12*Math.cos(i*.08);i==-20?x.moveTo(px,py):x.lineTo(px,py)}x.stroke();requestAnimationFrame(draw)}draw();
</script>
</body>
</html>
