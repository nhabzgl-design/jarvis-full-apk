<script>
const $=id=>document.getElementById(id);
let sample=null,lang='en-US',on=false,rec=null,speaking=false,busy=false,hist=[],state='STANDBY',amp=0,t=0;
const SYS=`You are J.A.R.V.I.S., the calm, dry-witted, loyal AI butler from Iron Man, running on the user's phone browser.

PERSONALITY:
- British butler vibe but speaks like a real Filipino when needed. Witty, calm, helpful, never cringe.
- Address user as "sir" normally, but if user says "boss", call him "boss" too. Use "po" naturally when speaking Tagalog, not forced.

LANGUAGE RULES - VERY IMPORTANT FOR TAGALOG:
- If user speaks English, reply in natural English.
- If user speaks Tagalog or Taglish, reply in NATURAL Manila Tagalog / Taglish - like how real Filipinos talk in Makati/BGC!
- AVOID bad literal translations! AVOID deep formal Tagalog like "batid ko", "datapwat", "subalit", "marapat". NEVER use those!
- USE everyday conversational Tagalog: "Gets kita boss", "Sige ayusin natin", "Ayos na yan", "Tara", "Sige lang", "Ano ba", "Syempre", "Oo naman"
- It's OK to mix Tagalog + English naturally (Taglish) - that's how Filipinos really talk! Example: "Sige boss, naayos ko na yung timer mo, 5 minutes lang!"
- Keep it short, 2 sentences max, spoken aloud. No markdown, no lists, no emojis.
- Sound smart, not like a textbook or Google Translate!

TOOLS:
- Use tools when user wants action: timer, open site, call, text, WhatsApp, email, note, location, battery.
- You cannot read Messenger/phone notifications from a web page (browser security). If asked, explain briefly in natural Tagalog: "Boss hindi ko pa mabasa direct yung Messenger dahil naka-browser lang ako, pero pag ni-paste mo dito babasahin ko!" and suggest pasting.

Never claim action succeeded unless tool returned success.
Write your name as "Jarvis", never spelled J.A.R.V.I.S in speech.
`;
function setSt(s){state=s;const e=$('st');e.textContent=s;e.className=s=='STANDBY'?'':'on'}
function log(k,txt,href){const p=document.createElement('p');p.className=k;p.textContent=(k=='you'?'> ':k=='jarvis'?'J: ':'! ')+txt;if(href){p.append(' ');const a=document.createElement('a');a.href=href;a.target='_blank';a.rel='noopener';a.textContent='open';p.append(a)}$('log').append(p);$('log').scrollTop=1e9}
function openLink(u){let w=null;try{w=window.open(u,'_blank')}catch(_){}if(!w)log('sys','Tap to continue:',u)}

async function nativeListen(){
  const SR = NSR();
  if(!SR) return false;
  try{
    const perm = await SR.requestPermissions().catch(()=>null);
    if(perm && perm.speechRecognition && perm.speechRecognition!=='granted'){
      log('sys','Mic permission denied, allow in app settings');
      return false;
    }
  }catch(_){}
  try{
    await SR.start({language: lang, maxResults: 1, prompt: "Speak now", partialResults: true, popup: false});
    setSt('LISTENING');
    return true;
  }catch(e){ log('sys','Native mic error '+e.message); return false; }
}
let nativeListening=false;
function setupNativeSR(){
  const SR=NSR();
  if(!SR) return;
  SR.addListener('partialResults', data=>{
    if(data && data.matches && data.matches[0]){
      $('int').textContent = data.matches[0].slice(-40);
    }
  });
  SR.addListener('listeningState', s=>{
    if(s && !s.status) {
      if(on && !busy && !speaking) setTimeout(()=>nativeListen(), 300);
    }
  });
  SR.addListener('result', data=>{
    const txt = data && data.matches && data.matches[0] ? data.matches[0].trim() : '';
    $('int').textContent='';
    if(txt) ask(txt);
  });
}

const NSR=()=>window.Capacitor&&window.Capacitor.Plugins&&Capacitor.Plugins.SpeechRecognition;
const tools=[
 {name:'open_url',description:'Open website',inputSchema:{type:'object',properties:{url:{type:'string'}},required:['url']},execute:({url})=>{openLink(url);return 'opened '+url}},
 {name:'phone_action',description:'Call SMS WhatsApp email',inputSchema:{type:'object',properties:{kind:{type:'string'},target:{type:'string'},body:{type:'string'}},required:['kind','target']},execute:({kind,target,body})=>{const b=encodeURIComponent(body||'');let u='';if(kind=='whatsapp'){u='https://wa.me/'+String(target).replace(/[^0-9]/g,'')+'?text='+b;}else if(kind=='mailto'){u='mailto:'+target+'?body='+b;}else{u=kind+':'+target+(kind=='sms'&&body?'?body='+b:'');}openLink(u);return 'prepared '+kind}},
 {name:'set_timer',description:'Set timer',inputSchema:{type:'object',properties:{seconds:{type:'number'},label:{type:'string'}},required:['seconds']},execute:({seconds,label})=>{setTimeout(()=>{log('sys','Timer: '+(label||'done'))},seconds*1000);return 'timer '+seconds}},
 {name:'remember',description:'Save note',inputSchema:{type:'object',properties:{note:{type:'string'}}},required:[],execute:({note})=>{let n=[];try{n=JSON.parse(localStorage.getItem('jv')||'[]')}catch(_){}if(note){n.push(note);localStorage.setItem('jv',JSON.stringify(n));return 'saved'}return JSON.stringify(n)}},
 {name:'current_time',description:'Time',inputSchema:{type:'object',properties:{},required:[]},execute:()=>new Date().toString()},
 {name:'get_location',description:'GPS location',inputSchema:{type:'object',properties:{},required:[]},execute:async()=>{try{if(window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.Geolocation){const pos=await Capacitor.Plugins.Geolocation.getCurrentPosition();const lat=pos.coords.latitude,lng=pos.coords.longitude;openLink('https://maps.google.com/?q='+lat+','+lng);return 'Location '+lat+','+lng;}if(navigator.geolocation){return await new Promise((res,rej)=>{navigator.geolocation.getCurrentPosition(p=>{const lat=p.coords.latitude,lng=p.coords.longitude;openLink('https://maps.google.com/?q='+lat+','+lng);res('Location '+lat+','+lng);},e=>rej('GPS error'));});}return 'Location not available';}catch(e){return 'Location error '+e.message}}},
 {name:'get_battery',description:'Battery',inputSchema:{type:'object',properties:{},required:[]},execute:async()=>{try{if(window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.Device){const info=await Capacitor.Plugins.Device.getBatteryInfo().catch(()=>null);if(info)return 'Battery '+Math.round((info.batteryLevel||0)*100)+'%, Charging '+(info.isCharging?'yes':'no');}if(navigator.getBattery){const b=await navigator.getBattery();return 'Battery '+Math.round(b.level*100)+'%, '+(b.charging?'charging':'not charging');}return 'Battery not available';}catch(e){return 'Battery error '+e.message}}},
 {name:'get_device_info',description:'Device info',inputSchema:{type:'object',properties:{},required:[]},execute:async()=>{try{if(window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.Device){const info=await Capacitor.Plugins.Device.getInfo();return 'Model '+info.model+', OS '+info.operatingSystem+' '+info.osVersion;}return 'UA '+navigator.userAgent.slice(0,80);}catch(e){return 'Device error '+e.message}}},
 {name:'open_camera',description:'Open camera',inputSchema:{type:'object',properties:{},required:[]},execute:async()=>{try{if(window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.Camera){await Capacitor.Plugins.Camera.getPhoto({quality:90,resultType:'uri'});return 'Photo taken';}return 'Camera not installed';}catch(e){return 'Camera error '+e.message}}}
];try{n=JSON.parse(localStorage.getItem('jv')||'[]');if(note){n.push(note);localStorage.setItem('jv',JSON.stringify(n))}}catch(_){return 'storage unavailable'}return note?'saved':JSON.stringify(n)}},
 {name:'current_time',description:'Get the current local date and time.',inputSchema:{type:'object',properties:{}},execute:()=>new Date().toString()}];
function voice(tl){
  const V=speechSynthesis.getVoices();
  // For Tagalog, try to find best Filipino voice first
  if(tl){
    let v = V.find(x=>/fil|tl-PH/i.test(x.lang) && /natural|premium|enhanced/i.test(x.name)) 
         || V.find(x=>/fil|tl-PH/i.test(x.lang))
         || V.find(x=>/fil/i.test(x.name.toLowerCase()));
    if(v) return v;
  }
  // For English, British male
  return V.find(x=>/en[-_]GB/i.test(x.lang)&&/male|daniel|arthur|oliver|george/i.test(x.name))
      || V.find(x=>/en[-_]GB/i.test(x.lang))
      || V.find(x=>/^en/i.test(x.lang))
      || V[0];
}
function browserSpeak(s){
  if(!window.speechSynthesis){busy=false;return}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(s);
  const tl=/\b(ang|ng|mga|po|opo|ako|ikaw|hindi|naman|ba|sa|ko|mo|niya|natin|kayo|salamat|boss|nag|gusto|kasi|pero|tapos|yan|to|pa|lang|na|yung|ano|oo|sige|ayusin)\b/i.test(s);
  const v=voice(tl);
  if(v){u.voice=v;u.lang=v.lang;}
  else if(tl){u.lang='fil-PH';}
  // Natural prosody for Tagalog - slightly slower and lower pitch for more natural sound
  if(tl){ u.pitch=.78; u.rate=.92; } else { u.pitch=.82; u.rate=.97; }

 u.onstart=()=>{speaking=true;setSt('SPEAKING')};
 u.onend=u.onerror=done;speechSynthesis.speak(u)}
function reply(s){hist.push({role:'assistant',content:s});log('jarvis',s);speak(s)}
const K=k=>{try{return localStorage.getItem(k)||''}catch(_){return''}};
async function llm(m){
  const r=await fetch('https://jarvis-ai-9drf.onrender.com/chat',{method:'POST',headers:{'content-type':'application/json','x-pass':K('pw')||'1234'},body:JSON.stringify({system:SYS,tools:tools.map(({name,description,inputSchema})=>({name,description,input_schema:inputSchema})),messages:m})});
  if(!r.ok)throw new Error(r.status);
  return r.json()
}
async function ask(q){if(busy)return;busy=true;log('you',q);setSt('THINKING');
  hist.push({role:'user',content:q});hist=hist.slice(-6);while(hist[0]?.role!='user')hist.shift(); // Faster - less history
 try{const m=hist.map(h=>({...h}));let out='';
  for(let i=0;i<4;i++){const d=await llm(m);m.push({role:'assistant',content:d.content});const tu=d.content.filter(b=>b.type=='tool_use');out=d.content.filter(b=>b.type=='text').map(b=>b.text).join(' ')||out;if(!tu.length)break;
   const rs=[];for(const u of tu){let res;try{res=String(await tools.find(z=>z.name==u.name).execute(u.input))}catch(e){res='error'}rs.push({type:'tool_result',tool_use_id:u.id,content:res})}m.push({role:'user',content:rs})}
  reply((out||'Very good, sir.').replace(/[*#_`]/g,''))}
 catch(e){hist.pop();reply('Apologies sir, I could not reach my core. Please check the passcode.')}}
function done(){speaking=false;busy=false;setSt(on?'LISTENING':'STANDBY');setTimeout(()=>listen(), 300)}
// Fast mode toggle - double tap STANDBY to switch
let tapCount=0;
$('st').onclick=()=>{
  tapCount++;
  setTimeout(()=>tapCount=0, 400);
  if(tapCount>=2){
    const fast = localStorage.getItem('fastVoice') !== '0';
    localStorage.setItem('fastVoice', fast?'0':'1');
    log('sys', fast?'HQ ADAM voice ON (gwapo boses)!':'FAST phone voice ON (instant)! Double tap STANDBY to switch to ADAM');
    tapCount=0;
  }
};
async function speak(s){
  s=s.replace(/J\.?A\.?R\.?V\.?I\.?S\.?/gi,'Jarvis');
  window.speechSynthesis&&speechSynthesis.cancel();
  if(au){try{au.pause()}catch(_){} au=null}
  log('jarvis',s);
  hist.push({role:'assistant',content:s});
  // Try ElevenLabs first (Adam pNInz6obpgDQGcFmaJgB)
  try{
    const r=await fetch('https://jarvis-ai-9drf.onrender.com/tts',{method:'POST',headers:{'x-pass':K('pw')||'1234','content-type':'application/json'},body:JSON.stringify({text:s})});
    if(r.ok){
      const blob=await r.blob();
      const url=URL.createObjectURL(blob);
      const a=au=new Audio(url);
      a.onplay=()=>{speaking=true;setSt('SPEAKING')};
      a.onended=()=>{URL.revokeObjectURL(url); done();};
      a.onerror=()=>{URL.revokeObjectURL(url); browserSpeak(s);};
      await a.play();
      return;
    }
  }catch(e){ log('sys','TTS server busy, using phone voice'); }
  // Fallback to phone voice - ensure it speaks!
  browserSpeak(s);
  return;
}
async function speakOld(s){
  s=s.replace(/J\.?A\.?R\.?V\.?I\.?S\.?/gi,'Jarvis');
  window.speechSynthesis&&speechSynthesis.cancel();
  if(au){au.pause();au=null}
  
  // SPEED MODE: Start browser voice IMMEDIATELY (0ms) while ElevenLabs loads in background
  // Default to HQ Adam voice (fastVoice = 0 means HQ). Fast mode only if user double-tapped STANDBY
  const useFastMode = localStorage.getItem('fastVoice') === '1';
  
  if(useFastMode){
    // Instant browser voice - no waiting!
    browserSpeak(s);
    // Try ElevenLabs in background for next time, but don't wait
    try{
      const r=await fetch('https://jarvis-ai-9drf.onrender.com/tts',{method:'POST',headers:{'x-pass':K('pw'),'content-type':'application/json'},body:JSON.stringify({text:s})});
      if(r.ok){
        // Cache the audio for next similar response
        console.log('ElevenLabs ready for next time');
      }
    }catch(_){}
    return;
  } else {
    // High quality mode - wait for ElevenLabs
    try{
      const r=await fetch('https://jarvis-ai-9drf.onrender.com/tts',{method:'POST',headers:{'x-pass':K('pw'),'content-type':'application/json'},body:JSON.stringify({text:s})});
      if(!r.ok)throw 0;
      speechSynthesis.cancel();
      const a=au=new Audio(URL.createObjectURL(await r.blob()));
      a.onplay=()=>{speaking=true;setSt('SPEAKING')};
      a.onended=a.onerror=done;
      await a.play();
      return;
    }catch(e){
      log('sys','Using fast phone voice');
    }
    browserSpeak(s);
  }
}
$('keys').onclick=()=>{const p=prompt('Passcode',K('pw'));try{if(p!==null)localStorage.setItem('pw',p.trim())}catch(_){}};
async function listen(){
  if(!on || speaking || busy) return;
  const SR=NSR();
  if(SR){
    const ok = await nativeListen();
    if(ok) return;
  }
  if(!(rec&&!speaking&&!busy)) return;
  try{rec.start();setSt('LISTENING')}catch(_){}
}
function initRec(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){log('sys','Speech recognition is not supported in this browser. Use Chrome, or type below.');return false}
 rec=new SR();rec.lang=lang;rec.interimResults=true;
 rec.onresult=e=>{let f='',i='';for(const r of e.results)r.isFinal?f+=r[0].transcript:i+=r[0].transcript;$('int').textContent=(i||f).slice(-40);if(f.trim()){$('int').textContent='';ask(f.trim())}};
 rec.onerror=e=>{if(/not-allowed|service-not-allowed/.test(e.error)){on=false;$('mic').classList.remove('on');setSt('STANDBY');log('sys','Microphone is blocked here. Allow mic access for this page, or type instead.')}};
 rec.onend=()=>listen();return true}
setupNativeSR();
$('mic').onclick=async()=>{
  if(on){on=false;$('mic').classList.remove('on');try{const SR=NSR(); if(SR) await SR.stop().catch(()=>{}); }catch(_){} try{rec&&rec.abort()}catch(_){} speechSynthesis.cancel(); if(au){try{au.pause()}catch(_){}} speaking=busy=false; setSt('STANDBY'); return}

 if(!rec&&!initRec())return;on=true;$('mic').classList.add('on');if(!hist.length)reply('Good day, sir. Jarvis online. How may I assist?');else listen()};
$('lang').onclick=function(){lang=lang=='en-US'?'fil-PH':'en-US';this.textContent=lang=='en-US'?'EN':'TL';if(rec){rec.lang=lang;try{rec.abort()}catch(_){}}};
$('txt').onkeydown=e=>{if(e.key=='Enter'&&e.target.value.trim()){const q=e.target.value.trim();e.target.value='';ask(q)}};
$('send').onclick=()=>{const el=$('txt');const q=el.value.trim();if(q){el.value='';ask(q)}};
if(window.speechSynthesis){speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}} setupNativeSR();
$('cv').className=(window.SpeechRecognition||window.webkitSpeechRecognition)?'g':'';
$('cc').className='g';
// orb
const cv=$('orb'),x=cv.getContext('2d'),D=Math.min(devicePixelRatio||1,2),calm=matchMedia('(prefers-reduced-motion: reduce)').matches;let S=300;
function rs(){S=cv.clientWidth;cv.width=cv.height=S*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',rs);rs();
function arcs(r,n,gap,w,off,col){x.strokeStyle=col;x.lineWidth=w;const seg=6.283/n;for(let i=0;i<n;i++){x.beginPath();x.arc(S/2,S/2,r,off+i*seg,off+(i+1)*seg-gap);x.stroke()}}
function draw(){if(!calm)t+=.012;const th=state=='THINKING',col=th?'255,179,71':'95,216,255';
 const target=state=='SPEAKING'?.5+Math.random()*.5:state=='LISTENING'?.25+.15*Math.sin(t*6):th?.5:.1;amp+=(target-amp)*.15;
 x.clearRect(0,0,S,S);const c=S/2,R=S*.47;const g=x.createRadialGradient(c,c,R*.2,c,c,R);g.addColorStop(0,`rgba(${col},${.10+amp*.2})`);g.addColorStop(1,`rgba(${col},0)`);x.fillStyle=g;x.beginPath();x.arc(c,c,R,0,7);x.fill();
 arcs(R,5,.5,3,t*(th?3:.8),`rgba(${col},.9)`);arcs(R*.88,24,.12,2,-t*1.2,`rgba(${col},.55)`);arcs(R*.74,3,.9,4,t*1.9,`rgba(${col},.8)`);
 x.strokeStyle=`rgba(${col},.35)`;x.lineWidth=1;for(const k of[.62,.5]){x.beginPath();x.arc(c,c,R*k,0,7);x.stroke()}
 for(let i=0;i<60;i++){const a=i/60*6.283+t*.3,l=i%5?4:9;x.beginPath();x.moveTo(c+Math.cos(a)*R*1.0,c+Math.sin(a)*R*1.0);x.lineTo(c+Math.cos(a)*(R*1.0-l),c+Math.sin(a)*(R*1.0-l));x.stroke()}
 x.strokeStyle=`rgba(${col},.9)`;x.lineWidth=2;x.beginPath();for(let i=-20;i<=20;i++){const px=c+i*R*.016,py=c+R*.2+Math.sin(i*.7+t*8)*amp*R*.12*Math.cos(i*.08);i==-20?x.moveTo(px,py):x.lineTo(px,py)}x.stroke();
